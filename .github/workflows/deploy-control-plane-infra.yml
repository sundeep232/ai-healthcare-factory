name: Deploy control plane infrastructure

run-name: Deploy control plane infrastructure

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "control-plane/infra/**"
      - ".github/workflows/deploy-control-plane-infra.yml"

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Apply control-plane infrastructure
        working-directory: control-plane/infra/main
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_IN_AUTOMATION: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          terraform init -input=false \
            -backend-config="resource_group_name=rg-ahf-tfstate" \
            -backend-config="storage_account_name=stahftf4jqp3v" \
            -backend-config="container_name=tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
