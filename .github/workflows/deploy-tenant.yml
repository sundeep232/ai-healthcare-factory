name: Deploy tenant

run-name: ${{ inputs.action == 'destroy' && format('Destroy {0}', inputs.environment_id) || format('Deploy {0}', inputs.environment_id) }}

on:
  workflow_dispatch:
    inputs:
      slug:
        description: Azure-safe demo name
        required: true
        type: string
      display_name:
        description: Demo name from the portal
        required: true
        type: string
      environment_id:
        description: Control-plane environment id
        required: true
        type: string
      action:
        description: apply or destroy
        required: true
        type: choice
        default: apply
        options:
          - apply
          - destroy
      resources:
        description: JSON array of module names from the template
        required: false
        type: string
        default: '["sql","portal"]'
      synthetic_members:
        description: Synthetic members loaded into the tenant database after apply
        required: false
        type: string
        default: "250"

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8

      - name: Terraform
        working-directory: tenants/stack
        env:
          ARM_USE_OIDC: "true"
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TF_IN_AUTOMATION: "true"
          TF_ACTION: ${{ inputs.action }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_slug: ${{ inputs.slug }}
          TF_VAR_location: centralus
          TF_VAR_environment_id: ${{ inputs.environment_id }}
          TF_VAR_display_name: ${{ inputs.display_name }}
          TF_VAR_resources: ${{ inputs.resources }}
          SYNTHETIC_MEMBERS: ${{ inputs.synthetic_members }}
        run: |
          set -euo pipefail
          if [[ "$TF_ACTION" != "apply" && "$TF_ACTION" != "destroy" ]]; then
            echo "Action is invalid"
            exit 1
          fi
          if [[ ! "$TF_VAR_slug" =~ ^[a-z0-9-]{3,40}$ ]]; then
            echo "Slug is invalid"
            exit 1
          fi
          if [[ ! "$TF_VAR_environment_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            echo "Environment id is invalid"
            exit 1
          fi
          if ! jq -e 'type == "array" and all(.[]; type == "string" and (. == "sql" or . == "portal" or . == "openai" or . == "speech" or . == "communication")) and length == (unique | length)' <<<"$TF_VAR_resources" >/dev/null; then
            echo "Resources are invalid"
            exit 1
          fi
          ensure_provider() {
            local namespace="$1"
            local state
            state="$(az provider show --namespace "$namespace" --query registrationState -o tsv)"
            if [[ "$state" != "Registered" ]]; then
              echo "Registering ${namespace}"
              az provider register --namespace "$namespace" --wait
            fi
          }
          has() { jq -e --arg name "$1" 'any(. == $name)' <<<"$TF_VAR_resources" >/dev/null; }
          if has sql; then ensure_provider Microsoft.Sql; fi
          if has portal; then ensure_provider Microsoft.Web; fi
          if has openai || has speech; then ensure_provider Microsoft.CognitiveServices; fi
          if has communication; then ensure_provider Microsoft.Communication; fi
          echo "Terraform ${TF_ACTION} for ${TF_VAR_resources}"
          terraform init -input=false \
            -backend-config="resource_group_name=rg-ahf-tfstate" \
            -backend-config="storage_account_name=stahftf4jqp3v" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=tenants/${TF_VAR_slug}.tfstate" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"
          terraform "$TF_ACTION" -input=false -auto-approve
          if [[ "$TF_ACTION" == "apply" ]] && has sql; then
            if [[ ! "$SYNTHETIC_MEMBERS" =~ ^[0-9]+$ ]] || (( SYNTHETIC_MEMBERS < 10 || SYNTHETIC_MEMBERS > 1000 )); then
              echo "Synthetic member count must be from 10 to 1000"
              exit 1
            fi
            sql_password="$(terraform output -raw sql_admin_password)"
            mask="${sql_password//%/%25}"
            mask="${mask//$'\n'/%0A}"
            mask="${mask//$'\r'/%0D}"
            echo "::add-mask::${mask}"
            sql_server="$(terraform output -raw sql_server_fqdn)"
            runner_ip="$(curl -fsS https://api.ipify.org)"
            echo "Loading synthetic payer data into ${sql_server}"
            az sql server firewall-rule delete \
              --resource-group "rg-${TF_VAR_slug}-ahf" \
              --server "sql-${TF_VAR_slug}" \
              --name gh-runner \
              --output none || true
            az sql server firewall-rule create \
              --resource-group "rg-${TF_VAR_slug}-ahf" \
              --server "sql-${TF_VAR_slug}" \
              --name gh-runner \
              --start-ip-address "$runner_ip" \
              --end-ip-address "$runner_ip" \
              --output none
            cleanup_firewall() {
              az sql server firewall-rule delete \
                --resource-group "rg-${TF_VAR_slug}-ahf" \
                --server "sql-${TF_VAR_slug}" \
                --name gh-runner \
                --output none || true
            }
            trap cleanup_firewall EXIT
            python3 -m venv "$RUNNER_TEMP/payer-seed"
            "$RUNNER_TEMP/payer-seed/bin/pip" install --disable-pip-version-check -q -r ../database/requirements.txt
            SQL_SERVER="$sql_server" \
              SQL_DATABASE="sqldb-tenant" \
              SQL_ADMIN_LOGIN="sqladmin" \
              SQL_ADMIN_PASSWORD="$sql_password" \
              SYNTHETIC_MEMBERS="$SYNTHETIC_MEMBERS" \
              "$RUNNER_TEMP/payer-seed/bin/python" ../database/seed.py
          fi
