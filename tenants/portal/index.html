<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Provider portal</title>
  <link rel="stylesheet" href="styles.css?v=2" />
  <script src="https://aka.ms/csspeech/jsbrowserpackageraw"></script>
</head>
<body>
  <div class="shell">
    <aside class="nav">
      <div class="brand">
        <span class="mark" id="mark">P</span>
        <div>
          <strong id="brand-name">Payer demo</strong>
          <span>Provider portal</span>
        </div>
      </div>
      <button type="button" class="nav-item active" data-view="home">Home</button>
      <button type="button" class="nav-item" data-view="claims">Claims</button>
      <button type="button" class="nav-item" data-view="authorizations">Authorizations</button>
      <button type="button" class="nav-item" data-view="members">Members</button>
      <button type="button" class="nav-item" data-view="care">Care management</button>
    </aside>
    <section class="workspace">
      <header class="topbar">
        <form id="search-form">
          <input id="search-input" placeholder="Search by claim, authorization, member, or name" autocomplete="off" />
        </form>
        <p class="demo-note">Synthetic data</p>
      </header>
      <div id="stage" class="stage"></div>
    </section>
    <aside class="assistant">
      <header>
        <div>
          <strong>AI assistant</strong>
          <span id="voice-status">Voice ready</span>
        </div>
      </header>
      <div id="thread" class="thread"></div>
      <div id="suggestions" class="suggestions"></div>
      <form id="chat-form" class="composer">
        <input id="chat-input" placeholder="Ask about the record on screen" autocomplete="off" />
        <button id="mic" type="button" title="Voice">Voice</button>
        <button type="submit">Send</button>
      </form>
    </aside>
  </div>
  <script src="config.js"></script>
  <script src="app.js?v=2"></script>
</body>
</html>
